apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
# Etiqueta común del curso (kustomize >= 5: 'labels' sustituye a 'commonLabels')
labels:
  - pairs:
      app.kubernetes.io/part-of: curso-k8s
    includeSelectors: false
    includeTemplates: true
