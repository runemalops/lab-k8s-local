apiVersion: apps/v1
kind: Deployment
metadata:
  name: curso-web
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: web
          env:
            - name: APP_ENV
              value: staging
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
