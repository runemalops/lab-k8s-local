name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  KUSTOMIZE_DIR: labs/lab10-cicd/manifests
  NS: lab10

jobs:
  validate:
    name: Validar manifiestos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO(1): renderiza los manifiestos y falla si el YAML es inválido
      - name: Kustomize build
        run: __COMANDO_KUSTOMIZE__

      # TODO(2): validación de esquema con kubeconform
      - name: kubeconform
        run: __COMANDO_KUBECONFORM__

  deploy:
    name: Desplegar a kind
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO(3): crear un clúster kind dentro del job
      - name: Crear clúster kind
        uses: __ACION_KIND__
        with:
          cluster_name: curso-k8s

      # TODO(4): renderizar y aplicar los manifiestos
      - name: Renderizar y aplicar manifiestos
        run: __COMANDO_APPLY__

      # TODO(5): comprobar que el despliegue terminó bien (job rojo si falla)
      - name: Comprobar rollout
        run: __COMANDO_ROLLOUT__
