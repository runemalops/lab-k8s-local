name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  KUSTOMIZE_DIR: labs/lab10-cicd/manifests
  NS: lab10

jobs:
  validate:
    name: Validar manifiestos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kustomize build
        run: |
          kubectl kustomize "$KUSTOMIZE_DIR" > rendered.yaml
          echo "Manifiestos renderizados:" && wc -l rendered.yaml

      - name: Validar sintaxis (dry-run)
        run: kubectl apply --dry-run=client -f rendered.yaml

      - name: kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -summary -strict rendered.yaml

  deploy:
    name: Desplegar a kind
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear clúster kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: curso-k8s

      - name: Renderizar y aplicar manifiestos
        run: |
          kubectl kustomize "$KUSTOMIZE_DIR" > rendered.yaml
          kubectl apply -f rendered.yaml

      - name: Comprobar rollout
        run: |
          kubectl rollout status deployment/curso-web -n "$NS" --timeout=180s
          kubectl get pods -n "$NS"
