apiVersion: apps/v1
kind: Deployment
metadata:
  name: curso-web
  namespace: lab10
  labels:
    app: curso-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: curso-web
  template:
    metadata:
      labels:
        app: curso-web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
