apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: curso-web
  namespace: lab06
  labels:
    app.kubernetes.io/part-of: curso-k8s
spec:
  ingressClassName: nginx
  rules:
    - host: app.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
