apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab06
  labels:
    app: web
    app.kubernetes.io/part-of: curso-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: curso-k8s
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab06
  labels:
    app.kubernetes.io/part-of: curso-k8s
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab06
  labels:
    app: api
    app.kubernetes.io/part-of: curso-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: curso-k8s
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ["-text=API v1 OK", "-listen=:5678"]
          ports:
            - containerPort: 5678
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lab06
  labels:
    app.kubernetes.io/part-of: curso-k8s
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
