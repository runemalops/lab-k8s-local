# RBAC de mínimo privilegio (ESQUELETO)
# Objetivo: la ServiceAccount "curso-viewer" solo puede leer pods del namespace lab12.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: curso-viewer
  namespace: lab12
  labels:
    app.kubernetes.io/part-of: curso-k8s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: curso-viewer
  namespace: lab12
  labels:
    app.kubernetes.io/part-of: curso-k8s
rules:
  # TODO(1): SOLO lectura de pods (verbs: get, list)
  - apiGroups: [""]
    resources: [__RECURSOS__]
    verbs: [__VERBS__]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: curso-viewer
  namespace: lab12
  labels:
    app.kubernetes.io/part-of: curso-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: curso-viewer
subjects:
  # TODO(2): vincula la ServiceAccount creada arriba
  - kind: ServiceAccount
    name: __SA_NAME__
    namespace: lab12
