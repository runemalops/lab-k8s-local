# CASO 3 — roto a propósito. Síntoma esperado: Pod Pending
# Pista: pide más CPU de la que tiene el nodo.
apiVersion: v1
kind: Pod
metadata:
  name: fallo3
  namespace: lab12
  labels:
    app: fallo3
    app.kubernetes.io/part-of: curso-k8s
spec:
  containers:
    - name: web
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "8"          # <-- los nodos de kind no tienen 8 CPUs
          memory: "64Mi"
