apiVersion: v1
kind: ServiceAccount
metadata:
  name: curso-viewer
  namespace: lab12
  labels:
    app.kubernetes.io/part-of: curso-k8s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: curso-viewer
  namespace: lab12
  labels:
    app.kubernetes.io/part-of: curso-k8s
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: curso-viewer
  namespace: lab12
  labels:
    app.kubernetes.io/part-of: curso-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: curso-viewer
subjects:
  - kind: ServiceAccount
    name: curso-viewer
    namespace: lab12
