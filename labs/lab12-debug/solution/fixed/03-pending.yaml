apiVersion: v1
kind: Pod
metadata:
  name: fallo3
  namespace: lab12
  labels:
    app: fallo3
    app.kubernetes.io/part-of: curso-k8s
spec:
  containers:
    - name: web
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "100m"       # corregido: petición realista para un nodo local
          memory: "64Mi"
