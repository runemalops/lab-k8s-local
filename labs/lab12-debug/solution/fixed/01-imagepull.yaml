apiVersion: apps/v1
kind: Deployment
metadata:
  name: fallo1
  namespace: lab12
  labels:
    app: fallo1
    app.kubernetes.io/part-of: curso-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fallo1
  template:
    metadata:
      labels:
        app: fallo1
        app.kubernetes.io/part-of: curso-k8s
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
