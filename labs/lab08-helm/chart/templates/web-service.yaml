apiVersion: v1
kind: Service
metadata:
  name: {{ include "curso-web.fullname" . }}-web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "curso-web.labels" . | nindent 4 }}
    app: web
spec:
  type: ClusterIP
  selector:
    {{- include "curso-web.selectorLabels" . | nindent 4 }}
    app: web
  ports:
    - name: http
      # TODO(1): usa los valores de values.web.service
      port: 80
      targetPort: 80
