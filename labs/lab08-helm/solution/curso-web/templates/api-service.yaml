apiVersion: v1
kind: Service
metadata:
  name: {{ include "curso-web.fullname" . }}-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "curso-web.labels" . | nindent 4 }}
    app: api
spec:
  type: ClusterIP
  selector:
    {{- include "curso-web.selectorLabels" . | nindent 4 }}
    app: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
