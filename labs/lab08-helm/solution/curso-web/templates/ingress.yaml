{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "curso-web.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "curso-web.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.paths.api }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "curso-web.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: {{ .Values.ingress.paths.web }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "curso-web.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
