apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curso-web.fullname" . }}-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "curso-web.labels" . | nindent 4 }}
    app: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "curso-web.selectorLabels" . | nindent 6 }}
      app: api
  template:
    metadata:
      labels:
        {{- include "curso-web.selectorLabels" . | nindent 8 }}
        app: api
        app.kubernetes.io/part-of: curso-k8s
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args:
            {{- toYaml .Values.api.args | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
