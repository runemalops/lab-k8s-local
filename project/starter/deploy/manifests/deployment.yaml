# TODO: completa este manifiesto con tus 2 servicios (web + api),
# ConfigMap, Secret, requests/limits y probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mi-app
  labels:
    app: web
    app.kubernetes.io/part-of: curso-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: curso-k8s
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
